[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-highway-agent"
version = "0.3.0"
description = "Lightweight, read-only OS monitoring agent for Telemetry Highway"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["psutil>=5.9"]

[project.scripts]
th-agent = "telemetry_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
